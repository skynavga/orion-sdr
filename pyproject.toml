[build-system]
requires = ["maturin>=1.0"]
build-backend = "maturin"

[project]
name = "orion-sdr"
version = "0.0.67"
description = "Composable SDR/DSP block library targeting HF-to-EHF: analog and single-carrier digital modes, FT8/FT4, PSK31, OFDM/COFDM, and DVB-T/NB-DVB-T, with Python bindings"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.12"
dependencies = ["numpy>=1.24"]

[tool.maturin]
python-source = "python"
module-name = "orion_sdr.orion_sdr"
features = ["extension-module"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
